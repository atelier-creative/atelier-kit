<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-version" content="2">
    <title>Xuất Excel sản phẩm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }

        /* ── Header ─────────────────────────────── */
        .header {
            background: #fff;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title    { font-size: 15px; font-weight: 700; }
        .header-subtitle { font-size: 12px; color: #888; margin-top: 2px; }

        /* ── Toolbar ──────────────────────────────── */
        .toolbar {
            margin: 16px 16px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .load-btn {
            background: #4285f4;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .load-btn:hover { background: #3367d6; }
        .load-btn:disabled { background: #aaa; cursor: not-allowed; }

        .row-count { font-size: 13px; color: #666; }

        /* ── Status message ───────────────────────── */
        .status-msg {
            margin: 0 16px 10px;
            font-size: 13px;
            color: #888;
            min-height: 18px;
        }
        .status-msg.error { color: #ea4335; }

        /* ── Preview table ────────────────────────── */
        .table-wrap {
            margin: 0 16px;
            overflow-x: auto;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            font-size: 13px;
        }
        thead th {
            background: #e9ecef;
            padding: 10px 12px;
            text-align: left;
            font-weight: 700;
            white-space: nowrap;
            border-bottom: 2px solid #dee2e6;
        }
        tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #f8f9fa; }
        .td-img .img-ph {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* ── Action bar ─────────────────────────── */
        .action-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #fff;
            padding: 10px 14px;
            box-shadow: 0 -2px 8px rgba(0,0,0,.1);
            display: none;
        }
        .action-bar.visible { display: block; }

        .export-btn {
            width: 100%;
            background: #34a853;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background .2s;
        }
        .export-btn:hover { background: #2d9146; }
        .export-btn:disabled { background: #aaa; cursor: not-allowed; }

        /* ── Spinner ────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────── -->
<div class="header">
    <div>
        <div class="header-title">Xuất Excel sản phẩm</div>
        <div class="header-subtitle" id="headerSubtitle"></div>
    </div>
</div>

<!-- ── Main ─────────────────────────────────────────────── -->
<div style="padding-bottom:100px">
    <div class="toolbar">
        <button class="load-btn" id="loadBtn" onclick="loadProducts()">
            🔄 Tải danh sách
        </button>
        <span class="row-count" id="rowCount"></span>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="table-wrap">
        <table id="previewTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- ── Action bar ────────────────────────────────────────── -->
<div class="action-bar" id="actionBar">
    <button class="export-btn" id="exportBtn" onclick="exportExcel()">
        📥 Tải xuống Excel
    </button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  PARAMS
// ═══════════════════════════════════════════════════════════
function parseUrlParams() {
    const url = window.location.href;
    const qi  = url.indexOf('?');
    if (qi === -1) return {};
    const qs = url.substring(qi);

    const KNOWN = [
        'appsheet_key','app_id','app_name','table_name',
        'cols','col_labels','image_col','file_name','context_host','limit',
        'folder_id','google_client_id'  // kept as stop anchors for backwards-compat
    ];
    const get = (name) => {
        const re = new RegExp(`[?&]${name}=`);
        const m  = qs.match(re);
        if (!m) return '';
        const after = qs.substring(m.index + m[0].length);
        const ends  = KNOWN.filter(p => p !== name).map(p => after.indexOf(`&${p}=`)).filter(i => i !== -1);
        const end   = ends.length ? Math.min(...ends) : after.length;
        try { return decodeURIComponent(after.substring(0, end)); } catch { return after.substring(0, end); }
    };
    return Object.fromEntries(KNOWN.map(p => [p, get(p)]));
}

const P = parseUrlParams();
const COLS       = P.cols       ? P.cols.split(',').map(s => s.trim()).filter(Boolean) : [];
const COL_LABELS = P.col_labels ? P.col_labels.split(',').map(s => s.trim())           : [];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let productRows = [];   // raw rows from AppSheet
let imageCache  = {};   // imagePath → data URL or null

window.addEventListener('load', () => {
    document.getElementById('headerSubtitle').textContent = P.table_name || '';
});

// ═══════════════════════════════════════════════════════════
//  IMAGE FETCH — via AppSheet REST API files endpoint
// ═══════════════════════════════════════════════════════════
async function fetchImageDataUrl(imagePath) {
    if (imageCache[imagePath] !== undefined) return imageCache[imagePath];
    try {
        let r;
        if (imagePath.startsWith('http')) {
            r = await fetch(imagePath, { mode: 'cors', credentials: 'omit' });
        } else {
            r = await fetch(
                `https://api.appsheet.com/api/v2/apps/${P.app_id}/files?fileName=${encodeURIComponent(imagePath)}`,
                { headers: { 'ApplicationAccessKey': P.appsheet_key } }
            );
        }
        if (!r.ok) { imageCache[imagePath] = null; return null; }
        const blob = await r.blob();
        const dataUrl = await new Promise(res => {
            const rd = new FileReader();
            rd.onloadend = () => res(rd.result);
            rd.readAsDataURL(blob);
        });
        imageCache[imagePath] = dataUrl;
        return dataUrl;
    } catch (_) {
        imageCache[imagePath] = null;
        return null;
    }
}

// ═══════════════════════════════════════════════════════════
//  APPSHEET API
// ═══════════════════════════════════════════════════════════
async function fetchProducts() {
    const r = await fetch(
        `https://api.appsheet.com/api/v2/apps/${P.app_id}/tables/${encodeURIComponent(P.table_name)}/Action`,
        {
            method : 'POST',
            headers: { 'Content-Type': 'application/json', 'ApplicationAccessKey': P.appsheet_key },
            body   : JSON.stringify({ Action: 'Find', Properties: {}, Rows: [] })
        }
    );
    if (!r.ok) throw new Error(`AppSheet API ${r.status}`);
    const data = await r.json();
    return Array.isArray(data) ? data : (data.Rows || []);
}

// ═══════════════════════════════════════════════════════════
//  LOAD + PREVIEW
// ═══════════════════════════════════════════════════════════
async function loadProducts() {
    const btn = document.getElementById('loadBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Đang tải...';
    setStatus('');

    try {
        productRows = await fetchProducts();
        if (P.limit) productRows = productRows.slice(0, parseInt(P.limit));

        // Build header
        const thead = document.getElementById('tableHead');
        thead.innerHTML = '';
        const tr = document.createElement('tr');
        if (P.image_col) { const th = document.createElement('th'); th.textContent = 'Ảnh'; tr.appendChild(th); }
        COLS.forEach((col, i) => {
            const th = document.createElement('th');
            th.textContent = COL_LABELS[i] || col;
            tr.appendChild(th);
        });
        thead.appendChild(tr);

        // Build body
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        productRows.forEach(row => {
            const tr = document.createElement('tr');
            if (P.image_col) {
                const td = document.createElement('td');
                td.className = 'td-img';
                const ph = document.createElement('div');
                ph.className = 'img-ph';
                ph.textContent = row[P.image_col] ? '🖼️' : '—';
                td.appendChild(ph);
                tr.appendChild(td);
            }
            COLS.forEach(col => {
                const td = document.createElement('td');
                td.textContent = row[col] ?? '';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        document.getElementById('rowCount').textContent = `${productRows.length} sản phẩm`;
        if (productRows.length > 0) document.getElementById('actionBar').classList.add('visible');
        setStatus('');
    } catch (e) {
        setStatus('Lỗi tải dữ liệu: ' + e.message, true);
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '🔄 Tải danh sách';
    }
}

// ═══════════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════════
async function exportExcel() {
    if (!productRows.length) return;

    const btn = document.getElementById('exportBtn');
    btn.disabled = true;

    try {
        // Lazy-load ExcelJS
        if (typeof ExcelJS === 'undefined') {
            setStatus('Đang tải thư viện Excel...');
            await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js');
        }

        // Fetch all images
        if (P.image_col) {
            const paths = [...new Set(productRows.map(r => r[P.image_col]).filter(Boolean))];
            let done = 0;
            setStatus(`Đang tải ${paths.length} ảnh... (0/${paths.length})`);
            btn.innerHTML = '<span class="spinner"></span> Đang tải ảnh...';
            await Promise.all(paths.map(async p => {
                await fetchImageDataUrl(p);
                done++;
                setStatus(`Đang tải ảnh... (${done}/${paths.length})`);
            }));
        }

        setStatus('Đang tạo file Excel...');
        btn.innerHTML = '<span class="spinner"></span> Đang tạo file...';

        const workbook  = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet(P.table_name || 'Sản phẩm');

        // Define columns
        const sheetCols = [];
        if (P.image_col) sheetCols.push({ header: 'Ảnh', key: '__img', width: 14 });
        COLS.forEach((col, i) => sheetCols.push({ header: COL_LABELS[i] || col, key: col, width: 22 }));
        worksheet.columns = sheetCols;

        // Style header row
        const headerRow = worksheet.getRow(1);
        headerRow.font      = { bold: true, size: 11 };
        headerRow.fill      = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9ECEF' } };
        headerRow.height    = 22;
        headerRow.alignment = { vertical: 'middle' };

        const imgColIdx = P.image_col ? 0 : -1; // 0-based col index

        // Add rows
        for (let i = 0; i < productRows.length; i++) {
            const row      = productRows[i];
            const excelRow = i + 2; // row 1 = header

            const rowData = {};
            if (P.image_col) rowData.__img = '';
            COLS.forEach(col => { rowData[col] = row[col] ?? ''; });

            const wsRow = worksheet.addRow(rowData);
            wsRow.alignment = { vertical: 'middle', wrapText: true };

            if (P.image_col) {
                const dataUrl = row[P.image_col] ? imageCache[row[P.image_col]] : null;
                if (dataUrl) {
                    const base64 = dataUrl.split(',')[1];
                    const ext    = dataUrl.startsWith('data:image/png') ? 'png' : 'jpeg';
                    const imgId  = workbook.addImage({ base64, extension: ext });
                    worksheet.addImage(imgId, {
                        tl : { col: imgColIdx, row: excelRow - 1 },
                        ext: { width: 72, height: 72 }
                    });
                    wsRow.height = 56;
                } else {
                    wsRow.height = 30;
                }
            }
        }

        // Download
        const buffer = await workbook.xlsx.writeBuffer();
        const blob   = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url    = URL.createObjectURL(blob);
        const a      = document.createElement('a');
        a.href       = url;
        a.download   = P.file_name || 'san-pham.xlsx';
        a.click();
        URL.revokeObjectURL(url);

        setStatus(`Đã xuất ${productRows.length} sản phẩm.`);
    } catch (e) {
        setStatus('Lỗi xuất file: ' + e.message, true);
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '📥 Tải xuống Excel';
    }
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function setStatus(msg, isError = false) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className   = 'status-msg' + (isError ? ' error' : '');
}

function loadScript(src) {
    return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload  = res;
        s.onerror = () => rej(new Error('Failed to load ' + src));
        document.head.appendChild(s);
    });
}
</script>
</body>
</html>
